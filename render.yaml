databases:
  - name: avlod-db
    databaseName: avlod
    user: avlod
    plan: free
    ipAllowList: []

services:
  - type: web
    name: avlod-api
    runtime: docker
    plan: free
    dockerfilePath: ./avlod/apps/api/Dockerfile
    dockerContext: ./avlod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: avlod-db
          property: connectionString
      - key: WEB_ORIGIN
        value: https://avlod-shajara-humoyun.netlify.app
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: STORAGE_DRIVER
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /tmp/avlod-media
      - key: MEDIA_URL_SECRET
        generateValue: true
      - key: PUBLIC_DEMO_ENABLED
        value: "false"
