name: avlod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avlod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-avlod}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-avlod}']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for local development.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-avlod-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-change-me-local-only}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  # Creates the private bucket once MinIO is up.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_USER} $${MINIO_PASS}; do sleep 2; done;
      mc mb --ignore-existing local/$${BUCKET};
      mc anonymous set none local/$${BUCKET};
      "
    environment:
      MINIO_USER: ${S3_ACCESS_KEY_ID:-avlod-local}
      MINIO_PASS: ${S3_SECRET_ACCESS_KEY:-change-me-local-only}
      BUCKET: ${S3_BUCKET:-avlod-media}

volumes:
  pgdata:
  miniodata:
