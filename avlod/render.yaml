databases:
  - name: avlod-db
    databaseName: avlod
    user: avlod
    plan: basic-256mb
    ipAllowList: []

services:
  - type: web
    name: avlod-api
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    disk:
      name: avlod-media
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: avlod-db
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: true
      - key: STORAGE_DRIVER
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /var/data
      - key: MEDIA_URL_SECRET
        generateValue: true
      - key: PUBLIC_DEMO_ENABLED
        value: false

  - type: static
    name: avlod-web
    buildCommand: npm ci && npm run build -w @avlod/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
